name: AI Code Review (Push/PR)

on:
  push:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore state cache (optional)
        uses: actions/cache@v4
        with:
          path: Tool/AICodeReview/state
          key: ai-code-review-state-${{ github.ref }}

      - name: Install dependencies
        run: npm ci
        working-directory: ./Tool/AICodeReview

      - name: Guard ensure AI secrets are set
        shell: bash
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          if [ -z "$AI_BASE_URL" ] || [ -z "$AI_API_KEY" ] || [ -z "$AI_MODEL" ]; then
            echo "Required secrets (AI_BASE_URL, AI_API_KEY, AI_MODEL) are missing or unavailable (fork PRs hide secrets)."
            exit 1
          fi

      - name: Write base config
        shell: bash
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          cat > config/config.json << EOF
          {
            "repo": { "path": "${GITHUB_WORKSPACE}" },
            "model": {
              "provider": "openai",
              "options": {
                "baseURL": "${AI_BASE_URL}",
                "apiKey": "${AI_API_KEY}",
                "model": "${AI_MODEL}"
              }
            },
            "notifications": {
              "skipWhenNoSnippets": true,
              "reportStyle": "issues_with_snippets",
              "snippetFormat": "no_headers"
            },
            "schedule": { "intervalMinutes": 60, "dailyTime": "17:00", "cron": "" },
            "review": { 
              "include" : ["scr/**/*.cs"],
              "maxSnippetsPerCommit": 200, 
              "maxLinesPerSnippet": 20000
            }
          }
          EOF
        working-directory: ./Tool/AICodeReview

      - name: Patch notifications by secrets
        run: |
          node -e "const fs=require('fs');const p='config/config.json';const cfg=JSON.parse(fs.readFileSync(p,'utf8'));cfg.notifications=cfg.notifications||{};const lark=(process.env.LARK_WEBHOOK||'').trim();cfg.notifications.lark={ enabled: !!lark, webhook: lark };const wecom=(process.env.WECOM_WEBHOOK||'').trim();cfg.notifications.wecom={ enabled: !!wecom, webhook: wecom };fs.writeFileSync(p, JSON.stringify(cfg,null,2));"
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        working-directory: ./Tool/AICodeReview

      - name: Debug loaded config
        run: |
          node -e "const cfg=require('./config/config.json'); console.log('provider=', cfg.model.provider); console.log('baseURL=', cfg.model.options.baseURL); console.log('model=', cfg.model.options.model); console.log('lark enabled=', cfg.notifications?.lark?.enabled, 'len=', (cfg.notifications?.lark?.webhook||'').length); console.log('wecom enabled=', cfg.notifications?.wecom?.enabled, 'len=', (cfg.notifications?.wecom?.webhook||'').length);"
        working-directory: ./Tool/AICodeReview

      - name: Run review for push/PR
        env:
          ONE_SHOT: "true"
          REPO_PATH: ${{ github.workspace }}
          REVIEW_SINCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.updated_at || github.event.head_commit.timestamp }}
        run: node src/index.js
        working-directory: ./Tool/AICodeReview