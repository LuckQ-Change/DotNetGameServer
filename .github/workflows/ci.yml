name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Publish servers
        run: |
          dotnet publish src/Servers/DirectoryServer/DirectoryServer.csproj -c Release -o publish/DirectoryServer
          dotnet publish src/Servers/LoginServer/LoginServer.csproj -c Release -o publish/LoginServer
          dotnet publish src/Servers/LogicServer/LogicServer.csproj -c Release -o publish/LogicServer
          dotnet publish src/Servers/BattleServer/BattleServer.csproj -c Release -o publish/BattleServer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: servers
          path: publish/
