name: AI Code Review (dry-run)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["**"]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 保证有完整历史以生成 diff

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare deps (no package.json at repo root)
        run: |
          echo "{}" > package.json
          npm install axios dotenv nodemailer

      - name: Run AI review (dry-run)
        run: node tools/ai-review/ci-review.js
        env:
          AI_DRY_RUN: "true"
          # PR 场景用 base/head；push 场景自动回退
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: List reviews
        run: ls -la reviews || true

      - name: Upload reviews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review
          path: reviews/
