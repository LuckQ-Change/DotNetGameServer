syntax = "proto3";
package DotNetGameServer;

message Envelope {
  string type = 1;
  bytes payload = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
}

// 战斗相关消息
message StartBattleRequest {
  string player_id = 1;
  string battle_type = 2;
}

message StartBattleResponse {
  bool success = 1;
  string message = 2;
  string battle_id = 3;
  int32 player_hp = 4;
  int32 enemy_hp = 5;
}

message AttackRequest {
  string battle_id = 1;
  string player_id = 2;
  int32 damage = 3;
}

message AttackResponse {
  bool success = 1;
  string message = 2;
  int32 player_hp = 3;
  int32 enemy_hp = 4;
  bool battle_ended = 5;
  bool player_won = 6;
}

// 资源与热更相关消息
message ResourceBundleInfo {
  string name = 1;       // AB 名称
  string hash = 2;       // 文件哈希
  int32 size = 3;        // 字节大小
  string url = 4;        // 下载地址（可选，用于HTTP下载）
}

message QueryVersionRequest {
  string client_version = 1; // 客户端当前版本
  string platform = 2;       // 平台，如 win/ios/android
}

message QueryVersionResponse {
  bool update_available = 1;      // 是否有更新
  string latest_version = 2;      // 最新版本号
  repeated ResourceBundleInfo bundles = 3; // 需要更新的 AB 列表
}

message GetBundleRequest {
  string name = 1;     // AB 名称
  string version = 2;  // 目标版本
}

message GetBundleResponse {
  bool success = 1;
  string message = 2;
  bytes content = 3;   // 文件内容（演示用途，实际可改为分片/HTTP）
  string hash = 4;
  int32 size = 5;
}
