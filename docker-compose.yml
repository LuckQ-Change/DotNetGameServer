version: "3.8"
services:
  directory:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      SERVICE: "directory"
      PORT: 5500
      DIRECTORY_REGISTRY: "memory"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_password}
      REDIS_CONNECTION: "redis:6379,password=${REDIS_PASSWORD:-dev_password}"
      DIRECTORY_TOKEN_SECRET: ${DIRECTORY_TOKEN_SECRET:-dev-secret}
    ports:
      - "5500:5500"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  login:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      SERVICE: "login"
      PORT: 5501
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DB: ${MYSQL_DB:-game}
    ports:
      - "5501:5501"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  logic:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      SERVICE: "logic"
      PORT: 5502
    ports:
      - "5502:5502"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  battle:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      SERVICE: "battle"
      PORT: 5503
    ports:
      - "5503:5503"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  redis:
    image: redis:7
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    command: ["sh", "-c", "redis-server --save 20 1 --appendonly yes --loglevel warning --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" PING || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
