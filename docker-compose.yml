version: "3.8"

# 每个服务器为独立可执行项目，通过 build args 选择构建/运行的项目。
# 角色/运行期配置经 CLI 参数传入（本项目 config 仅来自 appsettings + CLI，CLI 优先）。
# 机密通过 compose 变量插值进 CLI（如 ${DIRECTORY_TOKEN_SECRET}）。
services:
  directory:
    build:
      context: .
      args:
        SERVER_PROJECT: src/Servers/DirectoryServer/DirectoryServer.csproj
        SERVER_DLL: DirectoryServer.dll
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      PORT: 5500
    command:
      - "--port=5500"
      - "--healthCheckUrl=http://+:8080"
      - "--directory:registry:mode=redis"
      - "--directory:registry:redis:connectionString=redis:6379,password=${REDIS_PASSWORD:-dev_password}"
      - "--directory:tokenSecret=${DIRECTORY_TOKEN_SECRET:-dev-secret}"
    ports:
      - "5500:5500"
      - "5101:8080"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  login:
    build:
      context: .
      args:
        SERVER_PROJECT: src/Servers/LoginServer/LoginServer.csproj
        SERVER_DLL: LoginServer.dll
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      PORT: 5501
    command:
      - "--port=5501"
      - "--healthCheckUrl=http://+:8080"
      - "--directory:tokenSecret=${DIRECTORY_TOKEN_SECRET:-dev-secret}"
      - "--heartbeat:directoryHost=directory"
      - "--heartbeat:directoryPort=5500"
    ports:
      - "5501:5501"
      - "5102:8080"
    depends_on:
      - directory
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  logic:
    build:
      context: .
      args:
        SERVER_PROJECT: src/Servers/LogicServer/LogicServer.csproj
        SERVER_DLL: LogicServer.dll
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      PORT: 5502
    command:
      - "--port=5502"
      - "--healthCheckUrl=http://+:8080"
      - "--directory:tokenSecret=${DIRECTORY_TOKEN_SECRET:-dev-secret}"
      - "--heartbeat:directoryHost=directory"
      - "--heartbeat:directoryPort=5500"
    ports:
      - "5502:5502"
      - "5103:8080"
    depends_on:
      - directory
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  battle:
    build:
      context: .
      args:
        SERVER_PROJECT: src/Servers/BattleServer/BattleServer.csproj
        SERVER_DLL: BattleServer.dll
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      PORT: 5503
    command:
      - "--port=5503"
      - "--healthCheckUrl=http://+:8080"
      - "--directory:tokenSecret=${DIRECTORY_TOKEN_SECRET:-dev-secret}"
      - "--heartbeat:directoryHost=directory"
      - "--heartbeat:directoryPort=5500"
    ports:
      - "5503:5503"
      - "5104:8080"
    depends_on:
      - directory
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_password}
    ports:
      - "6379:6379"
    command: ["sh", "-c", "redis-server --save 20 1 --appendonly yes --loglevel warning --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" PING || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
