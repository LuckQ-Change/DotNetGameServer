version: "3.8"
services:
  directory:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      SERVICE: "directory"
      PORT: 5500
      DIRECTORY_TOKEN_SECRET: ${DIRECTORY_TOKEN_SECRET:-changeme}
    ports:
      - "5500:5500"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  login:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      SERVICE: "login"
      PORT: 5501
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DB: ${MYSQL_DB:-game}
    ports:
      - "5501:5501"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  logic:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      SERVICE: "logic"
      PORT: 5502
    ports:
      - "5502:5502"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  battle:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      SERVICE: "battle"
      PORT: 5503
    ports:
      - "5503:5503"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  resource:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      SERVICE: "resource"
      PORT: 5504
    ports:
      - "5504:5504"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$PORT' || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped