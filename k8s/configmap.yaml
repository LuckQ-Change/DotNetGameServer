apiVersion: v1
kind: ConfigMap
metadata:
  name: game-server-config
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  SERVICE: "directory"
  PORT: "5500"
  DIRECTORY_REGISTRY: "redis"
  # Redis TLS/mTLS 配置（按需开启）
  DIRECTORY_REDIS_SSL: "true"
  DIRECTORY_REDIS_SSL_HOST: "redis"
  DIRECTORY_REDIS_VALIDATE_SERVER_CERT: "true"