# 每个服务器角色是独立镜像（构建时用 --build-arg SERVER_PROJECT/SERVER_DLL 选择）。
# 本文件为 Directory 角色的 Deployment 示例；Login/Logic/Battle 复制本模板，
# 改 metadata.name/标签、镜像（directory-server -> login-server 等）、端口与 args 即可。
# 配置仅来自 appsettings + CLI，因此机密通过 env(secret) 注入后由 sh -c 展开进 CLI 参数。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directory-server
  labels:
    app: directory-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: directory-server
  template:
    metadata:
      labels:
        app: directory-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: directory-server
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - directory-server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: server
          image: directory-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # 机密以 env 注入，再由 command 的 sh -c 展开为 CLI 参数（CLI 优先于 appsettings）。
            - name: REDIS_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: game-server-secret
                  key: REDIS_CONNECTION
            - name: DIRECTORY_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: game-server-secret
                  key: DIRECTORY_TOKEN_SECRET
          command:
            - "sh"
            - "-c"
            - >-
              exec dotnet DirectoryServer.dll
              --port=5500
              --healthCheckUrl=http://+:8080
              --telemetry:metrics:enabled=true
              --directory:registry:mode=redis
              "--directory:registry:redis:connectionString=$REDIS_CONNECTION"
              "--directory:tokenSecret=$DIRECTORY_TOKEN_SECRET"
          ports:
            - containerPort: 5500
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 5500
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5500
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: redis-client-cert
              mountPath: /etc/redis/tls
              readOnly: true
      volumes:
        - name: redis-client-cert
          secret:
            secretName: redis-client-cert-secret
---
apiVersion: v1
kind: Service
metadata:
  name: directory
spec:
  selector:
    app: directory-server
  ports:
    - protocol: TCP
      port: 5500
      targetPort: 5500