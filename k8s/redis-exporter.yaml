apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  labels:
    app: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0
          args:
            - "--redis.addr=redis://redis:6379"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: game-server-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 9121
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9121
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9121
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
      # 注：如果需要传递密码给 exporter，请使用 --redis.password 参数或 REDIS_PASSWORD 环境变量
      # 一些版本支持从环境变量读取：REDIS_PASSWORD
      # 如需 TLS，请参考官方文档增加 --redis.tls* 参数
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  labels:
    app: redis-exporter
spec:
  selector:
    app: redis-exporter
  ports:
    - protocol: TCP
      port: 9121
      targetPort: 9121