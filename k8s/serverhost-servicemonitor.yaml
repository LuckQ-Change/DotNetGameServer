apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: game-server-servicemonitor
  labels:
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app: directory-server
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
  namespaceSelector:
    matchNames:
      - default