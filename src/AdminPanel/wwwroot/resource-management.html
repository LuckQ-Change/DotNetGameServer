<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Management</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 700px;
            margin-top: 50px;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-bottom: 30px;
            color: #333;
        }
        .form-group label {
            font-weight: bold;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        #response {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .alert-success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .alert-danger {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        .alert-info {
            background-color: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-4">Upload New Resource</h2>
    <form id="uploadForm" enctype="multipart/form-data">
        <div class="form-group">
            <label for="fileInput">Select file:</label>
            <input type="file" class="form-control-file" id="fileInput" name="file" required>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Upload</button>
    </form>
    <div id="response" class="alert" role="alert" style="display: none;"></div>
</div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const fileInput = document.getElementById('fileInput');
        const responseDiv = document.getElementById('response');
        const file = fileInput.files[0];

        responseDiv.style.display = 'none';
        responseDiv.className = 'alert';

        if (!file) {
            responseDiv.textContent = 'Please select a file.';
            responseDiv.classList.add('alert-danger');
            responseDiv.style.display = 'block';
            return;
        }

        const formData = new FormData();
        formData.append('file', file);

        responseDiv.textContent = 'Uploading...';
        responseDiv.classList.add('alert-info');
        responseDiv.style.display = 'block';

        try {
            const response = await fetch('/api/resource/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (response.ok) {
                responseDiv.textContent = `Upload successful!\nResource ID: ${result.resourceId}\nPath: ${result.path}`;
                responseDiv.classList.remove('alert-info');
                responseDiv.classList.add('alert-success');
            } else {
                responseDiv.textContent = `Error: ${result.title || 'An unknown error occurred.'}`;
                responseDiv.classList.remove('alert-info');
                responseDiv.classList.add('alert-danger');
            }
        } catch (error) {
            responseDiv.textContent = 'A network error occurred.';
            responseDiv.classList.remove('alert-info');
            responseDiv.classList.add('alert-danger');
        }
    });
</script>

</body>
</html>
