syntax = "proto3";
package DotNetGameServer;

// 战斗相关消息
message StartBattleRequest {
  string player_id = 1;
  string battle_type = 2;
}

message StartBattleResponse {
  bool success = 1;
  string message = 2;
  string battle_id = 3;
  int32 player_hp = 4;
  int32 enemy_hp = 5;
}

message AttackRequest {
  string battle_id = 1;
  string player_id = 2;
  int32 damage = 3;
}

message AttackResponse {
  bool success = 1;
  string message = 2;
  int32 player_hp = 3;
  int32 enemy_hp = 4;
  bool battle_ended = 5;
  bool player_won = 6;
}