syntax = "proto3";
package DotNetGameServer;

message HeartbeatRequest {
  string server_id = 1;
  string server_type = 2;
  string host = 3;
  int32 port = 4;
  int32 player_count = 5;
  int32 capacity = 6;
  string region = 7;
  string version = 8;
  int64 timestamp = 9;
}

message HeartbeatResponse {
  bool accepted = 1;
  string message = 2;
  int64 next_heartbeat_interval = 3;
}

message ServerQueryRequest {
  string server_type = 1;
  string region = 2;
  string strategy = 3;
  int32 limit = 4;
}

message ServerInfo {
  string server_id = 1;
  string server_type = 2;
  string host = 3;
  int32 port = 4;
  int32 player_count = 5;
  int32 capacity = 6;
  float load = 7;
  string region = 8;
  string version = 9;
  int64 last_heartbeat = 10;
  string status = 11;
}

message ServerQueryResponse {
  repeated ServerInfo servers = 1;
}
