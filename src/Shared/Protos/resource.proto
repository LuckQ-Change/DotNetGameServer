syntax = "proto3";
package DotNetGameServer;

// 资源与热更相关消息
message ResourceBundleInfo {
  string name = 1;       // AB 名称
  string hash = 2;       // 文件哈希
  int32 size = 3;        // 字节大小
  string url = 4;        // 下载地址（可选，用于HTTP下载）
}

message QueryVersionRequest {
  string client_version = 1; // 客户端当前版本
  string platform = 2;       // 平台，如 win/ios/android
}

message QueryVersionResponse {
  bool update_available = 1;      // 是否有更新
  string latest_version = 2;      // 最新版本号
  repeated ResourceBundleInfo bundles = 3; // 需要更新的 AB 列表
}

message GetBundleRequest {
  string name = 1;     // AB 名称
  string version = 2;  // 目标版本
}

message GetBundleResponse {
  bool success = 1;
  string message = 2;
  bytes content = 3;   // 文件内容（演示用途，实际可改为分片/HTTP）
  string hash = 4;
  int32 size = 5;
}

// --- Resource Service Definition ---
service ResourceService {
  // Queries the latest resource version and necessary bundles
  rpc QueryVersion(QueryVersionRequest) returns (QueryVersionResponse);

  // Gets a specific resource bundle (can be deprecated if HTTP is used)
  rpc GetBundle(GetBundleRequest) returns (GetBundleResponse);
}