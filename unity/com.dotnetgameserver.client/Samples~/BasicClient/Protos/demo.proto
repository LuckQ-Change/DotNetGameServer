syntax = "proto3";
package DotNetGameServer.Demo;
option csharp_namespace = "DotNetGameServer.UnityClient.Samples.Generated";

message PingRequest {
  string message = 1;
}

message PingResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  int64 server_time_unix = 4;
}

message SaveNoteRequest {
  string note_id = 1;
  string body = 2;
}

message SaveNoteResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
}

message LoadNoteRequest {
  string note_id = 1;
}

message LoadNoteResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string body = 4;
}

message GuestLoginRequest {
  string display_name = 1;
}

message GuestLoginResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string user_id = 4;
  string access_token = 5;
  int64 expire_unix = 6;
  int32 recommended_refresh_seconds = 7;
}

message RefreshSessionRequest {
  string access_token = 1;
}

message RefreshSessionResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string user_id = 4;
  string access_token = 5;
  int64 expire_unix = 6;
  int32 recommended_refresh_seconds = 7;
}
